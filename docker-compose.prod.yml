version: '3.8'

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Write every change to disk, so a restart of the server or of this container
    # keeps the waiting order drafts, offers, supplier answers and scheduled tasks.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  web:
    build:
      context: .
    command: sh /app/entrypoint.sh
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery:
    build:
      context: .
    command: celery -A config worker -l info -c 2
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # MCP server: lets a customer order through Claude. Holds no data; it calls
  # `web` with the customer's own API token. Drafts live in memory, so keep
  # it a single instance.
  mcp:
    build:
      context: ./mcp_server
    environment:
      SMART_ORDERS_API: http://web:8000
      MCP_MAX_ORDERS_PER_DAY: ${MCP_MAX_ORDERS_PER_DAY:-5}
      # Public address Claude reaches, and the sign-in server it is pointed to.
      MCP_PUBLIC_BASE: ${MCP_PUBLIC_BASE:-https://smartorders.casacam.net}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-https://smartorders.casacam.net}
    depends_on:
      - web
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    env_file: .env.prod
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  certbot_www:
  certbot_conf:
