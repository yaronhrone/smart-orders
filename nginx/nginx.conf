# 127.0.0.11 is Docker's embedded DNS. A plain `proxy_pass http://web:8000` (or
# an `upstream { server web:8000; }` block) resolves that hostname ONCE, at
# nginx startup, and caches the IP forever — so the moment `web` gets
# recreated with a new container (any deploy that rebuilds it) nginx keeps
# proxying to the now-dead old IP until nginx itself is restarted, and every
# request 502s in between. Using a variable in proxy_pass forces nginx to
# re-resolve through this resolver on each request instead.
resolver 127.0.0.11 valid=10s;

# Redirect HTTP to HTTPS + serve certbot challenge
server {
    listen 80;
    server_name smartorders.casacam.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name smartorders.casacam.net;

    ssl_certificate     /etc/letsencrypt/live/smartorders.casacam.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartorders.casacam.net/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    # Django: API, django-admin, schema, webhook, health, static
    location ~ ^/(api|django-admin|schema|whatsapp|health|static)/ {
        set $django_upstream http://web:8000;
        proxy_pass         $django_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Next.js frontend
    location / {
        set $nextjs_upstream http://frontend:3000;
        proxy_pass         $nextjs_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
